{% extends "base.html" %}
{% block title %}Новый пользователь{% endblock %}
{% block content %}
<h1>Новый пользователь</h1>
<form method="post">
    <p>
        <label for="name">Имя</label>
        <input id="name" name="name" maxlength="100" required value="{{ form.get('name', '') }}">
    </p>
    <p>
        <label for="username">Username</label>
        <input id="username" name="username" maxlength="32" required value="{{ form.get('username', '') }}">
    </p>
    <p>
        <label for="email">Email</label>
        <input id="email" name="email" type="email" maxlength="150" required value="{{ form.get('email', '') }}">
    </p>
    <button type="submit">Сохранить</button>
</form>
{% endblock %}
