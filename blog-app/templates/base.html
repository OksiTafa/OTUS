<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block title %}Блог{% endblock %}</title>
    <style>
        body { font-family: system-ui, sans-serif; max-width: 800px; margin: 0 auto; padding: 16px; }
        nav a { margin-right: 16px; }
        .flash { padding: 8px 12px; margin: 8px 0; border-radius: 4px; }
        .flash.success { background: #e3f6e5; }
        .flash.error { background: #fbe3e3; }
        form p { display: flex; flex-direction: column; gap: 4px; }
        input, select, textarea { padding: 6px; font: inherit; }
        .card { border: 1px solid #ddd; border-radius: 6px; padding: 12px; margin: 12px 0; }
        .muted { color: #777; font-size: 0.9em; }
    </style>
</head>
<body>
<nav>
    <a href="{{ url_for('posts.list_posts') }}">Посты</a>
    <a href="{{ url_for('posts.add_post') }}">Новый пост</a>
    <a href="{{ url_for('users.list_users') }}">Пользователи</a>
    <a href="{{ url_for('users.add_user') }}">Новый пользователь</a>
</nav>

{% with messages = get_flashed_messages(with_categories=true) %}
    {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
    {% endfor %}
{% endwith %}

{% block content %}{% endblock %}
</body>
</html>
