{% extends 'store_app/base.html' %}

{% block title %}Удаление товара{% endblock %}

{% block content %}
    <h1>Удаление товара</h1>
    <p class="mt-4">Вы действительно хотите удалить товар «{{ product.name }}»?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Удалить</button>
        <a href="{% url 'product' product.id %}" class="btn btn-outline-secondary">Отмена</a>
    </form>
{% endblock %}
